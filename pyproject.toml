[project]
name = "outlook-fusion"
version = "0.1.0"
description = "Outlook 邮箱账户全生命周期管理系统：OAuth 授权 → token 保活 → 健康检查 → 邮件读取（IMAP/Graph 双协议）"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.6.1",
    "email-validator==2.2.0",
    "cryptography==44.0.0",
    "httpx==0.28.1",
    "aioimaplib==2.0.1",
    "python-multipart==0.0.19",
    "beautifulsoup4==4.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "aiosqlite==0.20.0",
    "ruff==0.8.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends in defaults is idiomatic

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
