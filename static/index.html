<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outlook Fusion - 控制台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f4f6fa; color: #222; }
  header {
    background: #1a2a6c; color: #fff; padding: 14px 24px; display: flex;
    align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header .actions button {
    background: rgba(255,255,255,.15); color: #fff; border: none; padding: 7px 14px;
    border-radius: 5px; margin-left: 8px; cursor: pointer; font-size: 13px;
  }
  header .actions button:hover { background: rgba(255,255,255,.28); }
  .wrap { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 10px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .card h3 { font-size: 15px; margin-bottom: 12px; color: #1a2a6c; }
  textarea {
    width: 100%; height: 110px; border: 1px solid #ddd; border-radius: 6px; padding: 10px;
    font-size: 12px; font-family: Consolas, monospace; resize: vertical;
  }
  .btn {
    background: #1a2a6c; color: #fff; border: none; padding: 8px 16px; border-radius: 5px;
    cursor: pointer; font-size: 13px; margin-top: 10px;
  }
  .btn:hover { opacity: .88; }
  .btn.ghost { background: #eef1f6; color: #333; }
  .btn.danger { background: #c0392b; }
  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 120px; text-align: center; padding: 14px 8px; border-radius: 8px; background: #f8fafc; }
  .stat .num { font-size: 26px; font-weight: 700; color: #1a2a6c; }
  .stat .lbl { font-size: 12px; color: #888; margin-top: 4px; }
  .msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .msg.ok { color: #27ae60; } .msg.err { color: #c0392b; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #eef1f6; }
  th { background: #f8fafc; color: #555; font-weight: 600; white-space: nowrap; }
  tr:hover td { background: #fafbfd; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .badge.active { background: #e8f8ef; color: #1e8449; }
  .badge.expired { background: #fdecea; color: #c0392b; }
  .badge.needs_reauth { background: #fef5e7; color: #b9770e; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; }
  .modal.open { display: flex; }
  .modal-box { background: #fff; border-radius: 10px; width: 90%; max-width: 640px; max-height: 85vh; overflow: auto; padding: 24px; }
  .modal-box h3 { margin-bottom: 14px; color: #1a2a6c; }
  .modal-box .close { float: right; cursor: pointer; color: #888; font-size: 20px; }
  .email-item { padding: 10px 12px; border-bottom: 1px solid #eef1f6; cursor: pointer; }
  .email-item:hover { background: #f5f7fb; }
  .email-item .subj { font-weight: 600; font-size: 13px; }
  .email-item .meta { font-size: 12px; color: #888; margin-top: 3px; }
  .email-body { font-size: 13px; line-height: 1.7; margin-top: 14px; white-space: pre-wrap; word-break: break-word; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar select, .toolbar input {
    padding: 7px 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <h1>📧 Outlook Fusion 控制台</h1>
  <div class="actions">
    <button onclick="loadAll()">刷新数据</button>
    <button onclick="logout()">退出登录</button>
  </div>
</header>

<div class="wrap">
  <div class="grid">
    <div class="card">
      <h3>📊 Token 健康</h3>
      <div class="stat-row" id="healthStats">
        <div class="stat"><div class="num">-</div><div class="lbl">总数</div></div>
        <div class="stat"><div class="num">-</div><div class="lbl">正常</div></div>
        <div class="stat"><div class="num">-</div><div class="lbl">已失效</div></div>
        <div class="stat"><div class="num">-</div><div class="lbl">需重授权</div></div>
      </div>
    </div>
    <div class="card">
      <h3>⚡ 批量导入账户</h3>
      <textarea id="batchText" placeholder="每行一条：邮箱----密码----client_id----令牌"></textarea>
      <button class="btn" onclick="batchImport()">开始导入</button>
      <div class="msg" id="batchMsg"></div>
    </div>
  </div>

  <div class="card" style="margin-bottom: 20px;">
    <h3>👥 账户列表</h3>
    <table>
      <thead><tr><th>邮箱</th><th>状态</th><th>协议</th><th>最后刷新</th><th>标签</th><th>操作</th></tr></thead>
      <tbody id="accountBody"><tr><td colspan="6" style="text-align:center;color:#999;">加载中…</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h3>📬 邮件查看</h3>
    <div class="toolbar">
      <select id="mailEmail"></select>
      <select id="mailFolder">
        <option value="inbox">收件箱</option>
        <option value="junk">垃圾邮件</option>
        <option value="all">全部</option>
      </select>
      <input id="mailPage" type="number" value="1" min="1" style="width:70px;" title="页码">
      <button class="btn ghost" onclick="loadEmails()">查看</button>
      <button class="btn ghost" onclick="exportCsv()">导出 CSV</button>
      <span class="msg" id="mailMsg"></span>
    </div>
    <div id="mailList"><div style="color:#999;font-size:13px;">先选择账户查看邮件</div></div>
  </div>
</div>

<!-- 邮件详情弹窗 -->
<div class="modal" id="detailModal">
  <div class="modal-box">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3 id="detailTitle">邮件详情</h3>
    <div id="detailMeta" style="font-size:12px;color:#888;margin-bottom:8px;"></div>
    <div class="email-body" id="detailBody">加载中…</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ACCOUNTS = [];

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: {'Content-Type': 'application/json'},
    ...opts,
  });
  if (res.status === 401) { window.location.href = '/login'; throw new Error('未登录'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
  return data;
}

async function loadAll() {
  try {
    const [list, health] = await Promise.all([
      api('/api/accounts'),
      api('/api/accounts/_health'),
    ]);
    ACCOUNTS = list.accounts || [];
    renderAccounts(ACCOUNTS);
    renderHealth(health);
    renderEmailSelect(ACCOUNTS);
  } catch (e) { alert(e.message); }
}

function renderHealth(h) {
  const stats = $('healthStats');
  stats.innerHTML = [
    ['总数', h.total], ['正常', h.active], ['已失效', h.expired], ['需重授权', h.needs_reauth],
  ].map(([lbl, num]) => `<div class="stat"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`).join('');
}

function renderAccounts(accounts) {
  const body = $('accountBody');
  if (!accounts.length) { body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;">暂无账户</td></tr>'; return; }
  body.innerHTML = accounts.map(a => `
    <tr>
      <td>${esc(a.email)}</td>
      <td><span class="badge ${esc(a.status)}">${esc(a.status)}</span></td>
      <td>${esc(a.email_protocol || 'auto')}</td>
      <td>${a.last_refreshed_at ? esc(new Date(a.last_refreshed_at).toLocaleString()) : '-'}</td>
      <td>${esc((a.tags || []).join(', ') || '-')}</td>
      <td>
        <button class="btn ghost" onclick="refreshOne('${esc(a.email)}')">刷新 Token</button>
        <button class="btn ghost" onclick="markStatus('${esc(a.email)}','expired')">标记失效</button>
        <button class="btn danger" onclick="delAccount('${esc(a.email)}')">删除</button>
      </td>
    </tr>`).join('');
}

function renderEmailSelect(accounts) {
  const sel = $('mailEmail');
  const prev = sel.value;
  sel.innerHTML = accounts.map(a => `<option value="${esc(a.email)}">${esc(a.email)}</option>`).join('');
  if (prev && accounts.some(a => a.email === prev)) sel.value = prev;
}

async function batchImport() {
  const msg = $('batchMsg');
  msg.className = 'msg'; msg.textContent = '导入中…';
  try {
    const r = await api('/api/accounts/batch', {
      method: 'POST',
      body: JSON.stringify({ text: $('batchText').value }),
    });
    msg.className = 'msg ok';
    msg.textContent = `成功 ${r.success}，失败 ${r.failed}${r.errors.length ? '：\n' + r.errors.slice(0, 5).join('\n') : ''}`;
    loadAll();
  } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
}

async function refreshOne(email) {
  try {
    await api(`/api/tokens/${encodeURIComponent(email)}/refresh`, { method: 'POST' });
    alert('刷新成功'); loadAll();
  } catch (e) { alert('刷新失败: ' + e.message); }
}

async function refreshAll() {
  try {
    const r = await api('/api/tokens/refresh-all', { method: 'POST' });
    alert(r.message); loadAll();
  } catch (e) { alert(e.message); }
}

async function markStatus(email, status) {
  try {
    await api(`/api/accounts/${encodeURIComponent(email)}/status`, {
      method: 'PUT', body: JSON.stringify({ status }),
    });
    loadAll();
  } catch (e) { alert(e.message); }
}

async function delAccount(email) {
  if (!confirm(`确定删除 ${email}？`)) return;
  try {
    await api(`/api/accounts/${encodeURIComponent(email)}`, { method: 'DELETE' });
    loadAll();
  } catch (e) { alert(e.message); }
}

async function loadEmails() {
  const email = $('mailEmail').value;
  const folder = $('mailFolder').value;
  const page = $('mailPage').value || 1;
  const msg = $('mailMsg');
  msg.textContent = '加载中…';
  try {
    const data = await api(`/api/emails/${encodeURIComponent(email)}?folder=${folder}&page=${page}&page_size=20`);
    msg.className = 'msg ok';
    msg.textContent = `共 ${data.total_emails} 封`;
    const list = $('mailList');
    if (!data.emails.length) { list.innerHTML = '<div style="color:#999;font-size:13px;">无邮件</div>'; return; }
    list.innerHTML = data.emails.map(m => `
      <div class="email-item" onclick="showDetail('${esc(email)}','${esc(m.message_id)}')">
        <div class="subj">${esc(m.subject)}</div>
        <div class="meta">${esc(m.from_email)} · ${esc(m.date)}</div>
      </div>`).join('');
  } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
}

async function showDetail(email, messageId) {
  $('detailModal').classList.add('open');
  $('detailTitle').textContent = '邮件详情';
  $('detailBody').textContent = '加载中…';
  try {
    const d = await api(`/api/emails/${encodeURIComponent(email)}/${encodeURIComponent(messageId)}`);
    $('detailTitle').textContent = d.subject || '(无主题)';
    $('detailMeta').innerHTML = `<div>发件人: ${esc(d.from_email)}</div><div>收件人: ${esc(d.to_email)}</div><div>日期: ${esc(d.date)}</div>`;
    $('detailBody').textContent = d.body_plain || d.body_html || '(无正文)';
  } catch (e) {
    $('detailBody').textContent = '加载失败: ' + e.message;
  }
}

function closeModal() { $('detailModal').classList.remove('open'); }
$('detailModal').addEventListener('click', e => { if (e.target === $('detailModal')) closeModal(); });

function exportCsv() {
  const email = $('mailEmail').value;
  const folder = $('mailFolder').value;
  window.location.href = `/api/emails/${encodeURIComponent(email)}/export.csv?folder=${folder}&page_size=500`;
}

async function logout() {
  try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
  window.location.href = '/login';
}

loadAll();
</script>
</body>
</html>
